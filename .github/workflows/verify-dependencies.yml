name: 🧪 Comprehensive CI Validation Runner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📁 Checkout Repository Source
      uses: actions/checkout@v4

    - name: 🐍 Initialize Python Environment (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install Pinned System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🚀 Syntax Audit App Main Entry Point
      run: |
        python -m py_compile plant-topology-app.py
        print('✅ plant-topology-app.py syntax verification complete.')

    - name: 🔬 Execute Data Schema Validation Unit Test
      run: |
        python tests/validate_schema.py

    - name: 🎵 Execute Just Intonation Fractal Verification
      run: |
        python tests/test_harmonic_fractal.py

    - name: ⏱️ Execute Computational Speed Benchmarks
      run: |
        python tests/test_benchmarks.py
